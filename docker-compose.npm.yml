name: rewndly

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_CF_BEACON_TOKEN: ${VITE_CF_BEACON_TOKEN:-}
        NGINX_CONF: nginx.frontend.npm.conf
    image: rewndly-frontend:npm-trial
    container_name: rewndly_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_BIND:-127.0.0.1}:${FRONTEND_HTTP_PORT:-18080}:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rewndly_public
      - rewndly_private

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rewndly-api:npm-trial
    container_name: rewndly_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__Secret: ${Jwt__Secret}
      Jwt__AccessTokenMinutes: ${Jwt__AccessTokenMinutes:-15}
      Jwt__RefreshTokenDays: ${Jwt__RefreshTokenDays:-14}
      Cookie__Domain: ${Cookie__Domain:-}
      Cookie__SameSite: ${Cookie__SameSite:-Lax}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      Tmdb__AccessToken: ${Tmdb__AccessToken:-}
      Tmdb__ApiKey: ${Tmdb__ApiKey:-}
      Tmdb__BaseUrl: ${Tmdb__BaseUrl:-https://api.themoviedb.org/3}
      Tmdb__ImageBaseUrl: ${Tmdb__ImageBaseUrl:-https://image.tmdb.org/t/p}
      Tmdb__PosterSize: ${Tmdb__PosterSize:-w500}
      Tmdb__BackdropSize: ${Tmdb__BackdropSize:-w1280}
      Tmdb__TimeoutSeconds: ${Tmdb__TimeoutSeconds:-10}
      MDBLIST_API_KEY: ${MDBLIST_API_KEY:-}
      MDBLIST_BASE_URL: ${MDBLIST_BASE_URL:-https://api.mdblist.com}
      MdbList__Enabled: ${MdbList__Enabled:-true}
      MdbList__CacheHours: ${MdbList__CacheHours:-24}
      MdbList__NoDataCacheHours: ${MdbList__NoDataCacheHours:-6}
      MdbList__AuthFailureCooldownMinutes: ${MdbList__AuthFailureCooldownMinutes:-60}
      MdbList__RateLimitCooldownMinutes: ${MdbList__RateLimitCooldownMinutes:-15}
      MdbList__RankingCacheHours: ${MdbList__RankingCacheHours:-24}
      MdbList__TimeoutSeconds: ${MdbList__TimeoutSeconds:-15}
      Cloudflare__Enabled: ${Cloudflare__Enabled:-false}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_ACCOUNT_TAG: ${CLOUDFLARE_ACCOUNT_TAG:-}
      CLOUDFLARE_SITE_TAG: ${CLOUDFLARE_SITE_TAG:-}
      Cloudflare__CacheMinutes: ${Cloudflare__CacheMinutes:-15}
      Cloudflare__TimeoutSeconds: ${Cloudflare__TimeoutSeconds:-15}
      Wikidata__Enabled: ${Wikidata__Enabled:-true}
      WIKIDATA_USER_AGENT: ${WIKIDATA_USER_AGENT:-}
      Mail__Provider: ${Mail__Provider:-}
      Mail__ApiKey: ${Mail__ApiKey:-}
    expose:
      - "8080"
    volumes:
      - rewndly_data_protection_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - rewndly_public
      - rewndly_private

  postgres:
    image: postgres:17
    container_name: rewndly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rewndly_db}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-rewndly_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      REWNDLY_APP_DB_USER: ${REWNDLY_APP_DB_USER:-rewndly_app}
      REWNDLY_APP_DB_PASSWORD: ${REWNDLY_APP_DB_PASSWORD}
    volumes:
      - rewndly_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rewndly_private

  migrator:
    image: rewndly-api:npm-trial
    container_name: rewndly_migrator
    profiles:
      - ops
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      MigrationConnectionStrings__DefaultConnection: ${MigrationConnectionStrings__DefaultConnection}
    entrypoint: ["dotnet", "/app/tools/dbmigrator/Rewndly.DbMigrator.dll"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rewndly_private

  seed-admin:
    image: rewndly-api:npm-trial
    container_name: rewndly_seed_admin
    profiles:
      - ops
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      REWNDLY_ADMIN_USERNAME: ${REWNDLY_ADMIN_USERNAME}
      REWNDLY_ADMIN_EMAIL: ${REWNDLY_ADMIN_EMAIL}
      REWNDLY_ADMIN_INITIAL_PASSWORD: ${REWNDLY_ADMIN_INITIAL_PASSWORD}
    entrypoint: ["dotnet", "/app/tools/adminseeder/Rewndly.AdminSeeder.dll"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rewndly_private

networks:
  rewndly_public:
    name: rewndly_public
  rewndly_private:
    name: rewndly_private
    internal: true

volumes:
  rewndly_postgres_data:
    name: rewndly_postgres_data
  rewndly_data_protection_keys:
    name: rewndly_data_protection_keys
