services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moviesys_api
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5231:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moviesys_frontend
    restart: unless-stopped
    ports:
      - "5173:80"

  postgres:
    image: postgres:17
    container_name: moviesys_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - moviesys_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  moviesys_postgres_data:
