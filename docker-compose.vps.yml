name: moviesys

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: moviesys_reverse_proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/moviesys.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - moviesys_public

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: moviesys-frontend:trial
    container_name: moviesys_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - moviesys_public

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: moviesys-api:trial
    container_name: moviesys_api
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - moviesys_public
      - moviesys_private

  postgres:
    image: postgres:17
    container_name: moviesys_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moviesys_db}
      POSTGRES_USER: ${POSTGRES_USER:-moviesys_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - moviesys_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moviesys_private

  migrator:
    image: moviesys-api:trial
    container_name: moviesys_migrator
    profiles:
      - ops
    env_file:
      - ${ENV_FILE:-.env.production}
    entrypoint: ["dotnet", "/app/tools/dbmigrator/MovieSys.DbMigrator.dll"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - moviesys_private

  seed-admin:
    image: moviesys-api:trial
    container_name: moviesys_seed_admin
    profiles:
      - ops
    env_file:
      - ${ENV_FILE:-.env.production}
    entrypoint: ["dotnet", "/app/tools/adminseeder/MovieSys.AdminSeeder.dll"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - moviesys_private

networks:
  moviesys_public:
    name: moviesys_public
  moviesys_private:
    name: moviesys_private
    internal: true

volumes:
  moviesys_postgres_data:
    name: moviesys_postgres_data
